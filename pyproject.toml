[build-system]
requires = ["flit_core >=3.12.0,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
lint = [
  # Linting tools
  "codespell >=2.4.2",
  "deptry >=0.25.1",
  "flake8 >=7.3.0",
  "flake8-rst-docstrings >=0.4.0",
  "mypy >=1.20.0",
  "numpydoc >=1.10.0",
  "pylint >=4.0.4",
  "ruff >=0.15.9",
  "vulture >=2.14",
  "yamllint >=1.38.0"
]
test = [
  # Base testing support
  "coverage[toml] >=7.13.4",
  "nbval >=0.9.6",
  "pytest >=9.0.2",
  "pytest-cov >=7.0.0"
]
notebooks = [
  "nbconvert >=7.3.0",
  "nbsphinx >=0.9.5"
]
docs = [
  # Documentation and example support
  "ipykernel >=6.25.0",
  "ipython >=8.25.0,!=9.0.0",
  "jupyter_client",
  "nbsphinx >=0.9.8",
  "sphinx >=8.2.0",
  "sphinx-autobuild >=2024.4.16",
  "sphinx-click",
  "sphinx-codeautolink >=0.16.2",
  "sphinx-copybutton >=0.5.2",
  {include-group = "notebooks"}
]
tox = [
  "tox >=4.52.0",
  "tox-gh >=1.7.1"
]
dev = [
  # Development and testing tools
  "bump-my-version >=1.3.0",
  "pip >=26.0.1",
  "prek >=0.3.0",
  "watchdog >=6.0.0",
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "test"},
  {include-group = "tox"}
]

[project]
name = "birdhouse-birdy"
authors = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"}
]
maintainers = [
  {name = "Carsten Ehbrecht", email = "ehbrecht@dkrz.de"}
]
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10.0"
keywords = ["birdy", "wps", "pywps", "owslib", "geopython", "birdhouse"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed"
]
dynamic = ["description", "version"]
dependencies = [
  "boltons >=23.0",
  "click >=8.3.1",
  "cryptography>=46.0.5",
  "jinja2 >=3.0.0",
  "lxml >=5.0.0",
  "owslib >=0.19.2",
  "packaging >=23.0",
  "pyOpenSSL >=26.3.0",
  "python-dateutil >=2.8.1",
  "requests >=2.24.0",
  "urllib3>=2.6.0",
  "wrapt >=1.14.0"
]

[project.optional-dependencies]
extras = [
  "fiona >=1.10.1",
  "geojson >=3.0.0",
  "ipyleaflet >=0.20.0",
  "ipython >8.25.0,!=9.0.0",
  "ipywidgets >=8.0.5",
  "netCDF4 >=1.6.0",
  "pymetalink >=6.5.3",
  "rioxarray >=0.19.0",
  "xarray >=2023.1.0"
]

[project.scripts]
birdy = "birdy.cli.run:cli"

[project.urls]
"Homepage" = "https://birdy.readthedocs.io/"
"Changelog" = "https://birdy.readthedocs.io/en/stable/changelog.html"
"Issue tracker" = "https://github.com/bird-house/birdy/issues"
"Source" = "https://github.com/bird-house/birdy"

[tool]

[tool.bumpversion]
current_version = "0.10.0"
commit = true
commit_args = "--no-verify"
tag = false
tag_name = "v{new_version}"
allow_dirty = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\-(?P<release>[a-z]+)(\\.(?P<build>\\d+)))?"
serialize = [
  "{major}.{minor}.{patch}-{release}.{build}",
  "{major}.{minor}.{patch}"
]

[[tool.bumpversion.files]]
filename = "CHANGELOG.rst"
include_bumps = ["release"]
search = """\
`Unreleased <https://github.com/bird-house/birdy>`_ (latest)
------------------------------------------------------------
"""
replace = """\
..
    `Unreleased <https://github.com/bird-house/birdy>`_ (latest)
    ------------------------------------------------------------

    Contributors:

    Changes
    ^^^^^^^
    * No change.

    Fixes
    ^^^^^
    * No change.

.. _changes_{new_version}:

`v{new_version} <https://github.com/bird-house/birdy/tree/{new_version}>`_ ({now:%Y-%m-%d})
-----------------------------------------------------------------------------
"""

[[tool.bumpversion.files]]
filename = "CITATION.cff"
include_bumps = ["release"]
search = "^version: \"[0-9]+\\.[0-9]+\\.[0-9]\""
regex = true
replace = "version: \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/birdy/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "tests/test_birdy.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = ".cruft.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[tool.bumpversion.parts.build]
independent = false

[tool.bumpversion.parts.release]
optional_value = "release"
values = [
  "dev",
  "release"
]

[tool.codespell]
ignore-words-list = "astroid,inout,inpt,processus,socio-economic,thirdparty"
skip = "tests/resources/wps_fly_desc.xml"

[tool.coverage.paths]
source = ["src/birdy/", "*/site-packages/birdy/"]

[tool.coverage.run]
omit = ["tests/*.py"]
relative_files = true
source = ["birdy"]

[tool.cruft]
skip = []

[tool.deptry]
extend_exclude = ["extras"]
pep621_dev_dependency_groups = ["extras"]

[tool.flit.module]
name = "birdy"

[tool.flit.sdist]
include = [
  ".zenodo.json",
  "AUTHORS.rst",
  "CHANGELOG.rst",
  "CITATION.cff",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.rst",
  "LICENSE",
  "Makefile",
  "README.rst",
  "environment-dev.yml",
  "environment-docs.yml",
  "docs/_static/*",
  "docs/*.rst",
  "docs/conf.py",
  "docs/make.bat",
  "docs/Makefile",
  "pyproject.toml",
  "src/birdy",
  "tests/*.py",
  "tox.toml"
]
exclude = [
  "*.py[co]",
  "__pycache__",
  ".editorconfig",
  ".flake8",
  ".github",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".readthedocs.yml",
  ".yamllint.yaml",
  ".zizmor.yml",
  "CI/requirements_ci.*",
  "docs/_*",
  "docs/apidoc/modules.rst",
  "docs/apidoc/birdy*.rst"
]

[tool.mypy]
files = "."
python_version = "3.10"
show_error_codes = true
strict = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  # Don't require test functions to include types
  "tests.*"
]
allow_untyped_defs = true
disable_error_code = "attr-defined"
ignore_missing_imports = true

[tool.numpydoc_validation]
checks = [
  "all", # report on all checks, except the below
  "EX01",
  "SA01",
  "ES01",
  "GL06",
  "GL07",
  "GL08",
  "PR01",
  "RT01",
  "SS01"
]
# remember to use single quotes for regex in TOML
exclude = [
  # don't report on objects that match any of these regex
  '\.undocumented_method$',
  '\.__repr__$'
]
override_SS05 = [
  # override SS05 to allow docstrings starting with these words
  '^Process ',
  '^Assess ',
  '^Access '
]

[tool.pytest]
minversion = "9.0"
addopts = [
  "-ra",
  "--color=yes",
  "--strict",
  "--tb=native",
  "--verbose"
]
filterwarnings = ["ignore::UserWarning"]
testpaths = [
  "tests"
]
markers = [
  "online: mark test to need internet connection",
  "slow: mark test to be slow"
]

[tool.ruff]
src = ["birdy"]
line-length = 150
exclude = [
  ".eggs",
  ".git",
  "build",
  "docs"
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
extend-select = [
  "D213", # multi-line-summary-second-line
  "RUF022" # unsorted-dunder-all
]
ignore = [
  "COM", # commas
  "D205", # blank-line-after-summary
  "D400", # ends-in-period
  "D401" # non-imperative-mood
]
preview = true
select = [
  "B", # bugbear
  "BLE", # blind-except
  "C90", # mccabe-complexity
  "D", # docstrings
  "E", # pycodestyle errors
  "F", # pyflakes
  "FLY002", # static-join-to-fstring
  "G", # logging-format
  "I", # imports
  "N", # naming conventions
  "PERF", # iterator performance
  "PTH", # pathlib
  "RUF010", # explicit-f-string-type-conversion
  "RUF013", # implicit-optional
  "S", # bandit
  "UP", # python version conventions
  "W" # pycodestyle warnings
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.isort]
known-first-party = ["birdy"]
case-sensitive = true
detect-same-package = false
lines-after-imports = 2
no-lines-before = ["future", "standard-library"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["E402"]
"src/birdy/**/__init__.py" = ["F401", "F403"]
"src/birdy/cli/base.py" = ["S307"]
"tests/**" = ["D100", "D101", "D102", "D103", "S101"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 180

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.vulture]
exclude = []
ignore_decorators = ["@pytest.fixture"]
ignore_names = []
min_confidence = 90
paths = ["src/birdy", "tests"]
sort_by_size = true
